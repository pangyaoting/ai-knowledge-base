# ============================================================================
# AI 知识库 · Nginx「先签证书」用的最小配置（仅 80，无 TLS）
#
# 【为什么需要这个文件】
# 完整配置 deploy/nginx.conf 的 443 server 块引用了
#   /etc/letsencrypt/live/aiknowbase.cn/fullchain.pem
# 证书还没签出来时，`nginx -t` 会直接报 "cannot load certificate ... No such file"
# → 配置装不上、也就没有 ACME 校验目录 → certbot 必然失败（先有鸡还是先有蛋）。
# 所以正确顺序是：
#   ① 装本文件（80：站点先跑起来 + 提供 ACME 校验目录）
#   ② certbot certonly --webroot 签证书（走 80，不用停 nginx）
#   ③ 换成完整配置 deploy/nginx.conf（443 生效，80 自动 301 跳 HTTPS）
#
# 【用法】
#   sudo cp deploy/nginx-http-only.conf /etc/nginx/sites-available/kb
#   sudo ln -sf /etc/nginx/sites-available/kb /etc/nginx/sites-enabled/kb
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -I http://aiknowbase.cn          # 期望 200：域名上站点已经通了
#
# 【另外两个用途】
#   · 证书续期出问题/证书过期时的应急回滚（换回本文件，80 先保住可用）
#   · 排障时对比"是 HTTPS 层坏了还是应用层坏了"
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name aiknowbase.cn;  # www 备案通过后再加 www.aiknowbase.cn

    # 前端产物 = CI 在服务器上 `pnpm --filter @app/web build` 的输出目录。
    # ⚠️ 不是 /var/www/kb-web —— 本服务器实际就指向项目内的 apps/web/dist，
    #    好处是 CI 每次部署重构完就自动生效，不需要额外 copy。
    root /opt/kb/ai-knowledge-base/apps/web/dist;
    index index.html;

    # 前端上传大图/大文档：nginx 侧放宽（后端另有 20mb bodyParser 限制）
    client_max_body_size 50m;

    # Let's Encrypt HTTP-01 校验目录（certbot --webroot -w /var/www/certbot 写这里）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物：内容哈希 → 强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 头像：目录必须与后端写入目录一致（AVATAR_DIR），换头像要立刻生效 → no-store。
    # 刻意不写 try_files：nginx 的 try_files 与 alias 混用有已知缺陷（trac #97）
    location /avatars/ {
        alias /opt/kb/ai-knowledge-base/uploads/avatars/;
        add_header Cache-Control "no-store";
    }

    # API 反向代理（含 SSE 关缓冲，否则对话不逐字输出）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
