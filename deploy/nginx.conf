# ============================================================================
# AI 知识库 · Nginx 生产配置模板（域名 + HTTPS）
#
# 【替换点】把 aiknowbase.cn 换成你的域名（本文件共 3 类：server_name ×2 段、
#          ssl_certificate 路径、注释）；你的实际配置在服务器
#          /etc/nginx/sites-available/kb（仓库这份是模板，不会被 CI 覆盖）。
#
# 【上线顺序】详见 docs/部署运维/40-ICP备案与域名上线实战.md（§九 有可直接粘贴的完整命令）
#   ⚠️ 别一上来就装本文件：443 段引用的证书还不存在时 `nginx -t` 会失败，certbot 也就签不成。
#   1. 域名解析 A 记录 → 服务器 IP（**备案通过后**再解析，否则大陆会被阻断）
#   2. 先装 deploy/nginx-http-only.conf（80：站点先跑起来 + 提供 ACME 校验目录）
#      sudo cp deploy/nginx-http-only.conf /etc/nginx/sites-available/kb
#      sudo ln -sf /etc/nginx/sites-available/kb /etc/nginx/sites-enabled/kb
#      sudo nginx -t && sudo systemctl reload nginx && curl -I http://aiknowbase.cn   # 期望 200
#   3. 签证书（HTTP-01 走 80 的 /.well-known/acme-challenge/，不用停 nginx）
#      sudo apt install -y certbot && sudo mkdir -p /var/www/certbot
#      sudo certbot certonly --webroot -w /var/www/certbot \
#           -d aiknowbase.cn --email 1701132825@qq.com --agree-tos
#      ⚠️ 先只签主域名：www 没确认备案/没解析时，多加一个 -d www... 会让**整条命令失败**，
#         一张证书都拿不到。www 确认后再用 --expand 补（见 docs/40 §九④）。
#   4. 再换成**本文件**（证书已存在，nginx -t 才过）：443 生效，80 自动 301 跳过去
#      sudo cp deploy/nginx.conf /etc/nginx/sites-available/kb
#      sudo nginx -t && sudo systemctl reload nginx && curl -I https://aiknowbase.cn # 期望 200
#
# 【两个易踩点】
#   - 80 端口要**永久**放行（腾讯云轻量要在控制台"防火墙"里放行，不只是 ufw）：
#     certbot 每 90 天自动续期仍走 80 校验，只为首次签发开一次 = 90 天后证书过期。
#   - http2 语法：nginx < 1.25.1 用 `listen 443 ssl http2;`（本模板），
#     ≥ 1.25.1 建议改成 `listen 443 ssl;` + `http2 on;`。
# ============================================================================

# ---------------------------------------------------------------------------
# HTTP(80)：只做 ACME 校验 + 全量跳 HTTPS
# 备案号/域名唯一化：两个协议两个主机名都能访问会产生重复页面，统一 301 收敛
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aiknowbase.cn;  # www 备案通过后再加 www.aiknowbase.cn（并 --expand 扩证书）

    # Let's Encrypt HTTP-01 校验目录（certbot --webroot 写这里；续期同样依赖它）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS(443)：唯一对外入口（后端 3000 只监听本机，不对外）
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;   # nginx 1.18 写法；≥1.25.1 改成 `listen 443 ssl;` + `http2 on;`
    listen [::]:443 ssl http2;
    server_name aiknowbase.cn;  # www 备案通过后再加 www.aiknowbase.cn

    # Let's Encrypt 证书（certbot 自动续期，不要手动删这个目录）
    ssl_certificate     /etc/letsencrypt/live/aiknowbase.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiknowbase.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：先给 5 分钟（300 秒）验证链路，`certbot renew --dry-run` 通过后再改 31536000。
    # 一旦下发长有效期，浏览器在有效期内**拒绝**走 HTTP 访问 —— 证书续期出问题时会连
    # "退回 http 应急"这条路都没有，所以别在没验证续期前就下一年。
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态文件 = CI 在服务器上构建的产物目录
    # ⚠️ 不是 /var/www/kb-web（本服务器没有这个目录）；指向项目内 apps/web/dist 的好处是
    #    CI 每次部署重构完即生效，无需额外 copy。换路径要连 CI 的 build 输出一起考虑。
    root /opt/kb/ai-knowledge-base/apps/web/dist;
    index index.html;

    # 文档/图片上传：nginx 侧放宽（后端另有 20mb bodyParser 限制，两边都要够）
    client_max_body_size 50m;

    # Vue Router history 模式：找不到文件就回 index.html，否则刷新 /chat 直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物 → 长期强缓存
    # 注：location 级 add_header 会**覆盖**（而非叠加）server 级继承的头，所以这里只带缓存头；
    # HSTS 由页面导航（location /）下发即可，静态资源带不带不影响防护效果。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 用户头像：单独静态目录。
    # ⚠️ 目录必须与后端写入目录一致（apps/server/src/common/paths.ts 的 AVATAR_DIR
    #    = <项目根>/uploads/avatars），不一致就是经典的"换了头像 404"。
    # 换头像后要立刻生效 → 必须 no-store（前端还会带 ?v=n 版本号双保险）。
    # ⚠️ 这里**刻意不写 try_files**：nginx 的 try_files 与 alias 混用有已知缺陷
    #    （trac #97：按 location 前缀而非 alias 路径拼路径，会把存在的文件判成 404），
    #    alias 目录下文件不存在时 nginx 本来就会返回 404。
    location /avatars/ {
        alias /opt/kb/ai-knowledge-base/uploads/avatars/;
        add_header Cache-Control "no-store";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端据此判断"客户端是 https"（生成回调/头像绝对地址时用得到）
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 流式输出关键配置（删了就没法"边想边出字"）----
        # nginx 默认攒满缓冲才吐，前端会看不到逐字流；关掉缓冲并放宽超时。
        # 研究/Agent 任务单次也可跑到几分钟，300s 超时给足。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Gzip 压缩（text/html 由 nginx 默认类型覆盖，这里补 JSON/JS/CSS/SVG）
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
