name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 代码检查和构建（PR 和 push 都跑）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11 # 与本地 pnpm 版本保持一致，避免 lockfile 兼容问题

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 与本地 Node 版本保持一致
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先生成 Prisma 客户端再类型检查（全新环境不会自动生成，缺了它 tsc 会报 Prisma.sql 等不存在）
      - name: Generate Prisma client
        run: cd apps/server && npx prisma generate

      - name: Type check server
        run: cd apps/server && npx tsc --noEmit

      - name: Build frontend
        run: pnpm --filter @app/web build

      - name: Build server
        run: pnpm --filter @app/server build

  # 自动部署（只在 push 到 main 时跑；没配服务器密钥时部署步骤自动跳过，不影响 CI 通过）
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # secrets 只能在 step 级条件里使用（job 级 if 不支持 secrets 上下文）
      - name: Deploy to server
        if: ${{ secrets.SERVER_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ai-knowledge-base
            git pull origin main
            pnpm install --frozen-lockfile
            cd apps/server
            npx prisma generate
            npx prisma migrate deploy
            pnpm build
            pm2 restart kb-server
            cd ../web
            pnpm build
            rm -rf /var/www/kb-web/*
            cp -r dist/* /var/www/kb-web/
            echo "✅ Deploy complete"
