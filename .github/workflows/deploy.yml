name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 代码检查和构建（PR 和 push 都跑）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11 # 与本地 pnpm 版本保持一致，避免 lockfile 兼容问题

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # 与本地 Node 版本保持一致
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先生成 Prisma 客户端再类型检查（全新环境不会自动生成，缺了它 tsc 会报 Prisma.sql 等不存在）
      - name: Generate Prisma client
        run: cd apps/server && npx prisma generate

      - name: Type check server
        run: cd apps/server && npx tsc --noEmit

      - name: Test server (Jest)
        run: cd apps/server && npx jest --silent

      - name: Test web (Vitest)
        run: pnpm --filter @app/web test

      - name: Build frontend
        run: pnpm --filter @app/web build

      - name: Build server
        run: pnpm --filter @app/server build

  # 自动部署（只在 push 到 main 时跑；没配服务器密钥时部署步骤自动跳过，不影响 CI 通过）
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 判断是否配置了服务器密钥（secrets 不能用在 if 表达式里，只能放 env 给脚本读）
      - name: Check deploy config
        id: deploy-check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "未配置服务器密钥，跳过部署（CI 仍算通过）"
            echo "deploy_enabled=false"
          else
            echo "deploy_enabled=true"
          fi

      - name: Deploy to server
        if: steps.deploy-check.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # 服务器代码目录为 tar 部署（无 .git），每次从 GitHub 下载替换，避免直连 GitHub 不稳定
            cd /opt/kb
            wget -q -O /tmp/kb.tar.gz "https://ghfast.top/https://github.com/pangyaoting/ai-knowledge-base/archive/refs/heads/main.tar.gz"
            cd /opt/kb/ai-knowledge-base && cp .env /opt/kb/.env.bak || true
            mkdir -p /opt/kb/uploads.bak && cp -r uploads/* /opt/kb/uploads.bak/ 2>/dev/null || true
            cd /opt/kb && rm -rf ai-knowledge-base && tar -xzf /tmp/kb.tar.gz -C /opt/kb && mv ai-knowledge-base-main ai-knowledge-base
            cp /opt/kb/.env.bak ai-knowledge-base/.env || true
            cp -r /opt/kb/uploads.bak/* ai-knowledge-base/uploads/ 2>/dev/null || true
            cd ai-knowledge-base
            pnpm install --no-frozen-lockfile
            # 应用数据库迁移（.env 是唯一配置源，从项目根目录读取）
            npx prisma migrate deploy --schema apps/server/prisma/schema.prisma
            cd apps/server && npx prisma generate && pnpm build && cd ../..
            export PATH="$PATH:$(npm prefix -g)/bin"
            pm2 restart kb-server
            pnpm --filter @app/web build
            echo "✅ Deploy complete"
